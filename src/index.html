    <script>
        (function() {
            const CDN_URL = 'https://telegram.org/js/telegram-web-app.js';
            const LOCAL_URL = 'js/telegram-web-app.js'; // Путь к вашему локальному файлу

            function loadScript(src, callback) {
                const script = document.createElement('script');
                script.src = src;
                script.onload = callback;
                script.onerror = () => {
                    console.warn('CDN недоступен, остаёмся на локальной копии telegram-web-app.js');
                    // Если CDN не грузится, пробуем локальный
                    /*const fallback = document.createElement('script');
                    fallback.src = LOCAL_URL;
                    fallback.onload = callback;
                    fallback.onerror = () => console.error('Не удалось загрузить Telegram Web App script');
                    document.head.appendChild(fallback);*/
                };
                document.head.appendChild(script);
            }

            // Запускаем загрузку
            loadScript(CDN_URL, () => {
                console.log('Telegram Web App script loaded');
                // Здесь можно инициировать логику, зависящую от WebApp
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                }
            });
        })();
    </script>
